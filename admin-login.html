<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - O/L Learning Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050814;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(180deg, rgba(255, 0, 127, 0.15), rgba(0, 240, 255, 0.1));
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
        }

        .login-card {
            background: #0f172a;
            padding: 40px 30px;
            border-radius: 16px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }

        .login-card h2 {
            text-align: center;
            color: #fff;
            margin-bottom: 25px;
            font-size: 1.6rem;
        }

        .login-card h2 i {
            color: #ff007f;
            margin-right: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            outline: none;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: #ff007f;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #ff007f, #7928ca);
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2><i class="fa-solid fa-shield-halved"></i> පරිපාලක පිවිසුම</h2>
        <div id="error-box" class="error-msg"></div>
        
        <div class="form-group">
            <label>Admin පරිශීලක නාමය</label>
            <input type="text" id="admin-user" placeholder="Username එක දෙන්න">
        </div>
        <div class="form-group">
            <label>Admin මුරපදය</label>
            <input type="password" id="admin-pass" placeholder="Password එක දෙන්න">
        </div>
        
        <button class="login-btn" onclick="adminLogin()">පරිපාලක මණ්ඩලයට පිවිසෙන්න</button>
        
        <div style="text-align: center; margin-top: 20px; font-size: 0.8rem; color: #64748b;">
            පරීක්ෂා කිරීමට: Username: <b>admin</b> | Password: <b>admin123</b>
        </div>
    </div>

    <script>
        function adminLogin() {
            let u = document.getElementById('admin-user').value.trim();
            let p = document.getElementById('admin-pass').value.trim();
            let err = document.getElementById('error-box');

            // පෙරනිමි Admin දත්ත පරීක්ෂාව
            if(u === "admin" && p === "admin123") {
                localStorage.setItem('isAdminLoggedIn', 'true');
                window.location.href = "admin-panel.html"; // Admin Panel එකට යොමු කරයි
            } else {
                err.innerText = "වැරදි පරිශීලක නාමයක් හෝ මුරපදයකි!";
            }
        }
    </script>
</body>
</html>
